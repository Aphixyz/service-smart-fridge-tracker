version: '3.8'

services:

  
  # ── PostgreSQL Database ──
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=my_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  # ── Database Management (Optional) ──
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  postgres_data:
